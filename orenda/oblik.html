<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Облік Аліни</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Golos+Text:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
:root{--lime:#C6F833;--lime2:#a8e01f;--pink:#FF4DA0;--blue:#5170FF;--orange:#FF7A29;--violet:#B15CFF;--dark:#16100E;--paper:#FFF4E2;--card:#FFFFFF;--soft:#FFE9C7;--line:#E8D7BC;--red:#E23B2E;--mut:#7a6a5c}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--dark);font-family:"Golos Text",system-ui,sans-serif;font-size:16px;line-height:1.35;padding-inline:12px;padding-block:12px 120px;overflow-x:hidden;background-image:radial-gradient(rgba(22,16,14,.07) 1.5px,transparent 1.6px);background-size:18px 18px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:Unbounded,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;margin:0;line-height:.95}
h1{font-size:clamp(28px,8vw,44px);color:var(--dark)}
h2{font-size:20px;margin:22px 0 10px}
.mono{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.head{background:linear-gradient(135deg,var(--lime),var(--lime2));border:3px solid var(--dark);box-shadow:0 8px 0 var(--dark);border-radius:22px;padding:14px 16px 0;margin-bottom:14px;position:relative;overflow:hidden}
.head h1{color:var(--dark)}
.head .mono{color:#3d4a12!important}
.hband{display:flex;gap:2px;justify-content:space-between;margin:6px -6px -10px}
.hband img{width:16%;max-width:74px;filter:drop-shadow(0 6px 0 rgba(22,16,14,.18))}
@media(prefers-reduced-motion:no-preference){.hband img{animation:bob 3.4s ease-in-out infinite}
.hband img:nth-child(2){animation-delay:-.5s}.hband img:nth-child(3){animation-delay:-1s}.hband img:nth-child(4){animation-delay:-1.5s}.hband img:nth-child(5){animation-delay:-2s}.hband img:nth-child(6){animation-delay:-2.5s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.top .mono{color:#3d4a12;max-width:100%;text-align:right;font-size:11px}

/* деньги */
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
@media(min-width:620px){.money{grid-template-columns:repeat(4,minmax(0,1fr))}}
.m{background:var(--card);border:3px solid var(--dark);box-shadow:0 5px 0 var(--dark);border-radius:18px;padding:13px}
.m b{display:block;font-family:Unbounded;font-size:clamp(18px,5.4vw,26px);letter-spacing:-.03em;overflow-wrap:anywhere}
.m span{font-size:13px;color:var(--mut);font-weight:600}
.m.in b{color:#2f7a24}.m.out b{color:var(--red)}.m.net b{color:#2b45c9}.m.dep b{color:var(--orange)}

/* табы */
.tabs{display:flex;gap:7px;overflow-x:auto;margin:16px -14px 0;padding:0 14px 6px}
.tab{flex:none;border:3px solid var(--dark);background:var(--card);color:var(--dark);border-radius:999px;padding:10px 15px;min-height:46px;font:700 15px "Golos Text";cursor:pointer}
.tab[aria-selected=true]{background:var(--lime);border-color:var(--lime);color:var(--dark)}
.tab b{background:var(--pink);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;font-size:12px}

/* календарь */
.calhead{display:flex;align-items:center;gap:10px;margin:14px 0 8px}
.calhead h3{flex:1;font-size:17px}
.calhead button{background:var(--card);border:3px solid var(--dark);color:var(--dark);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;width:100%}
.dow{font-family:"JetBrains Mono";font-size:10px;text-align:center;color:var(--mut)}
.cell{min-width:0;min-height:62px;background:var(--card);border:2px solid var(--line);border-radius:9px;padding:3px 3px 4px;font-size:11px;position:relative;overflow:hidden}
.cell.today{border-color:var(--dark);box-shadow:inset 0 0 0 3px var(--lime)}
.cell .d{font-family:"JetBrains Mono";font-size:11px;color:var(--mut);font-weight:700}
.cell .ev{display:block;min-width:0;max-width:100%;border-radius:5px;padding:2px 3px;margin-top:2px;font-weight:700;font-size:9px;color:#16100e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;width:100%;text-align:left}
.ev.rent{background:var(--lime)}.ev.ship{background:var(--blue);color:#fff}.ev.back{background:var(--orange)}.ev.sale{background:var(--violet);color:#fff}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px;font-weight:600}
.leg i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px}

/* список */
.item{position:relative;overflow:hidden;background:var(--card);border:3px solid var(--dark);box-shadow:0 6px 0 var(--dark);border-radius:18px;padding:13px 14px;margin-top:12px;border-left:12px solid var(--lime)}
.item .stk{position:absolute;right:-10px;bottom:-14px;width:104px;opacity:1;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.item .h,.item .sub,.item .dates,.item .sumline,.item .badges{position:relative;z-index:2}
.item .badges{max-width:calc(100% - 78px)}
.item.sale{border-left-color:var(--violet)}
.item .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.item .nm{font-family:Unbounded;font-size:17px;text-transform:uppercase;letter-spacing:-.02em}
.item .sub{color:var(--mut);font-size:14px;margin-top:3px}
.item .dates{font-family:"JetBrains Mono";font-size:13px;margin-top:6px;color:#2f7a24;font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.b{border:2px solid var(--dark);background:var(--soft);color:var(--dark);border-radius:999px;padding:8px 12px;min-height:40px;font:700 13px "Golos Text";cursor:pointer}
.b.on{background:var(--lime);border-color:var(--dark);color:var(--dark)}
.b.dep.on{background:var(--orange);border-color:var(--orange)}
.b.del{border-color:var(--red);color:var(--red);background:#ffe6e2}
.sumline{margin-top:8px;font-family:"JetBrains Mono";font-size:13px;color:var(--dark);font-weight:700}

/* форма */
.add{background:var(--card);border:3px solid var(--dark);box-shadow:0 6px 0 var(--dark);border-radius:20px;padding:16px;margin-top:12px}
.costrow{display:flex;gap:10px;align-items:center}
.costrow select{flex:1}
.costrow img{width:74px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));transition:transform .2s}
.add label{display:block;font-weight:700;margin:10px 0 5px;font-size:14px}
.add input,.add select,.add textarea{width:100%;background:var(--soft);border:2px solid var(--dark);color:var(--dark);border-radius:12px;padding:12px;font:inherit;min-height:46px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>div{min-width:0}
.add input{min-width:0;max-width:100%}
.btn{width:100%;background:var(--pink);color:#fff;border:3px solid var(--dark);box-shadow:0 5px 0 var(--dark);border-radius:999px;padding:16px;font-family:Unbounded;font-weight:900;font-size:16px;text-transform:uppercase;cursor:pointer;margin-top:14px;min-height:54px}
.btn.lime{background:var(--lime);color:var(--dark)}
.btn.ghost{background:var(--card);color:var(--dark);box-shadow:none}
.btn.red{background:#ffe6e2;color:var(--red);border-color:var(--red);box-shadow:none}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.chk input{width:24px;height:24px;min-height:0;accent-color:#2f7a24}
.msum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
@media(min-width:620px){.msum{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mhint{font-size:12px;color:var(--mut);margin-top:4px}
.empty{color:var(--mut);text-align:center;padding:26px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--pink);color:#fff;border:3px solid var(--dark);border-radius:999px;padding:16px 22px;font-family:Unbounded;font-weight:900;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;z-index:8;min-height:54px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--dark);border:3px solid var(--dark);padding:11px 18px;border-radius:999px;font-weight:700;z-index:20}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
.note{font-size:13px;color:var(--mut);margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px}

/* баланс */
.m.hd b{color:#2f7a24}.m.rd b{color:var(--orange)}.m.rt b{color:#2b45c9}.m.al b{color:var(--dark)}
.bcard{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--dark);box-shadow:0 5px 0 var(--dark);border-radius:18px;padding:10px 12px;margin-top:10px}
.bcard img{width:56px;flex:none}
.bcard .bn{font-family:Unbounded;font-size:15px;text-transform:uppercase;letter-spacing:-.02em}
.bcard .bh{font-family:Unbounded;font-size:20px;margin-left:auto;text-align:right;white-space:nowrap}
.bcard .bs{font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}
.bcard.over{border-color:var(--red);background:#ffe6e2}
.wk{overflow-x:auto;margin-top:8px}
.wk table{border-collapse:collapse;width:100%;min-width:480px;font-size:13px;background:var(--card);border:3px solid var(--dark)}
.wk th,.wk td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line)}
.wk th:first-child,.wk td:first-child{text-align:left;font-weight:700;padding-left:8px}
.wk .z{color:var(--red);font-weight:700}
.stock{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin-top:6px;font-weight:700}
.warn{background:#ffe6e2;border:2px solid var(--red);color:var(--red);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700;font-size:13px}
</style></head><body><div class="wrap">

<div class="head"><div class="top"><h1>Облік</h1><span class="mono" id="sync">локально на цьому пристрої</span></div>
 <div class="hband"><img src="media/st/pavuk.png" alt=""><img src="media/st/rat.png" alt=""><img src="media/st/guard.png" alt=""><img src="media/st/batman.png" alt=""><img src="media/st/shark.png" alt=""><img src="media/st/biomeh.png" alt=""></div></div>

<div class="money" id="money"></div>
<div class="money" id="bal" style="cursor:pointer" title="Відкрити баланс"></div>

<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>

</div>
<button class="fab" id="fab" type="button">+ Запис</button>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="oblik-data.js"></script>
<script>
(function(){
"use strict";
var API=window.BOOKING_API||"", KEY="";
var PRICE={"Павук":200,"Бетмен":200,"Охоронець":200,"Біомеханіка":200,"Щур":250,"Акула":250};
function price(c){return PRICE[c]!=null?PRICE[c]:(String(c).indexOf("Акула")===0?250:200)}
var ST={"Павук":"pavuk","Бетмен":"batman","Охоронець":"guard","Біомеханіка":"biomeh","Щур":"rat","Акула":"shark"};
var CLR={"Павук":"var(--pink)","Бетмен":"var(--violet)","Охоронець":"var(--lime)","Біомеханіка":"var(--blue)","Щур":"var(--orange)","Акула":"var(--blue)"};
function stKey(name){name=String(name||"");for(var k in ST){if(name.indexOf(k)===0)return ST[k]}return ""}
function stImg(name,cls){var k=stKey(name);return k?"<img class='"+(cls||"stk")+"' src='media/st/"+k+".png' alt=''>":""}
function clr(name){name=String(name||"");for(var k in CLR){if(name.indexOf(k)===0)return CLR[k]}return "var(--lime)"}
var tab="cal", cur=new Date(), mcur=new Date(), items=[], ed=null;
function $(s){return document.querySelector(s)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){if(!s)return null;var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function fm(s){return s?(s.split("-")[2]+"."+s.split("-")[1]):"—"}
function toast(t){var e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2200)}
function load(){
 try{items=JSON.parse(localStorage.getItem("oblik")||"[]")}catch(e){items=[]}
 if(typeof window.OBLIK_DROP==="function"){var before=items.length;items=items.filter(function(o){try{return !window.OBLIK_DROP(o)}catch(e){return true}});if(items.length!==before)save()}
 var seed=window.OBLIK_SEED||[],have={};items.forEach(function(o){have[o.id]=1});
 var added=0;seed.forEach(function(o){if(!have[o.id]){items.push(JSON.parse(JSON.stringify(o)));added++}});
 if(added){save()}
}
function save(){try{localStorage.setItem("oblik",JSON.stringify(items))}catch(e){}}
function uid(){return "z"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

/* ---------- деньги ---------- */
function mk(d){return d?String(d).slice(0,7):""}
function nf(n){return (n||0).toLocaleString("uk-UA")}
function mname(key){var a=key.split("-");return new Date(+a[0],+a[1]-1,1).toLocaleDateString("uk-UA",{month:"long",year:"numeric"})}
function depTakenDate(o){return o.depTakenAt||o.ship||o.from||""}
function depBackDate(o){return o.depBackAt||o.back||o.to||""}
/* підсумки місяця: дохід — оплачені оренди за датою оренди і продажі за датою продажу */
function stats(key){
 var r={inc:0,out:0,depIn:0,depOut:0,cnt:0};
 items.forEach(function(o){
  if(o.type==="spend"){if(mk(o.from)===key)r.out+=+o.sum||0;return}
  if(o.paid&&mk(o.from)===key){r.inc+=+o.sum||0;r.cnt++}
  if(o.type==="rent"){
   if(o.depTaken&&mk(depTakenDate(o))===key)r.depIn+=+o.dep||0;
   if(o.depBack&&mk(depBackDate(o))===key)r.depOut+=+o.dep||0;
  }
 });
 r.net=r.inc-r.out;return r;
}
function onHand(){var d=0;items.forEach(function(o){if(o.type==="rent"&&o.depTaken&&!o.depBack)d+=+o.dep||0});return d}
function money(){
 var key=mk(ymd(today())),r=stats(key),nm=today().toLocaleDateString("uk-UA",{month:"long"});
 $("#money").innerHTML=
  "<div class='m in'><b>"+nf(r.inc)+" ₴</b><span>заробила за "+nm+"</span></div>"+
  "<div class='m out'><b>"+nf(r.out)+" ₴</b><span>витрати за "+nm+"</span></div>"+
  "<div class='m net'><b>"+nf(r.net)+" ₴</b><span>чистими за "+nm+"</span></div>"+
  "<div class='m dep'><b>"+nf(onHand())+" ₴</b><span>застав на руках зараз</span></div>";
}

/* ---------- вкладки ---------- */
var TABS=[{id:"cal",n:"Календар"},{id:"bal",n:"Баланс"},{id:"now",n:"В роботі",f:function(o){return o.type!=="spend"&&!o.done}},
 {id:"all",n:"Усі записи",f:function(){return true}},{id:"money",n:"Гроші"}];
function drawTabs(){
 $("#tabs").innerHTML="";
 TABS.forEach(function(t){
  var b=document.createElement("button");b.className="tab";b.type="button";b.setAttribute("role","tab");
  b.setAttribute("aria-selected",tab===t.id?"true":"false");
  var c=t.f?items.filter(t.f).length:0;
  b.innerHTML=t.n+(c?"<b>"+c+"</b>":"");
  b.onclick=function(){tab=t.id;draw()};$("#tabs").appendChild(b)})}

/* ---------- календарь ---------- */
function calendar(){
 var v=$("#view"),y=cur.getFullYear(),m=cur.getMonth();
 var h="<div class='calhead'><button type='button' id='pm'>‹</button><h3>"+cur.toLocaleDateString("uk-UA",{month:"long",year:"numeric"})+"</h3><button type='button' id='nm'>›</button></div><div class='cgrid'>";
 ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].forEach(function(d){h+="<div class='dow'>"+d+"</div>"});
 var first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=ymd(today());
 for(var i=0;i<off;i++)h+="<div></div>";
 for(var k=1;k<=n;k++){
  var s=ymd(new Date(y,m,k)),ev="";
  items.forEach(function(o){
   if(o.type==="spend")return;
   if(o.type==="sale"){ if(o.from===s) ev+="<button class='ev sale' data-id='"+o.id+"'>продаж "+o.costume+"</button>"; return}
   if(o.ship===s) ev+="<button class='ev ship' data-id='"+o.id+"'>↑ віддали "+o.costume+"</button>";
   if(o.from&&o.to&&s>=o.from&&s<=o.to) ev+="<button class='ev rent' data-id='"+o.id+"'>"+o.costume+"</button>";
   if(o.back===s) ev+="<button class='ev back' data-id='"+o.id+"'>↓ назад "+o.costume+"</button>";
  });
  h+="<div class='cell"+(s===t?" today":"")+"'><span class='d'>"+k+"</span>"+ev+"</div>";
 }
 h+="</div><div class='leg'><span><i style='background:var(--blue)'></i>віддали костюм</span><span><i style='background:var(--lime)'></i>день оренди</span><span><i style='background:var(--orange)'></i>відправляють назад</span><span><i style='background:var(--violet)'></i>продаж</span></div>";
 v.innerHTML=h;
 $("#pm").onclick=function(){cur=new Date(y,m-1,1);draw()};
 $("#nm").onclick=function(){cur=new Date(y,m+1,1);draw()};
 v.querySelectorAll(".ev").forEach(function(b){b.onclick=function(){openForm(items.filter(function(o){return o.id===b.dataset.id})[0])}});
}

/* ---------- список ---------- */
function list(filter){
 var L=items.filter(filter).sort(function(a,b){return String(a.from).localeCompare(String(b.from))});
 if(!L.length){$("#view").innerHTML="<div class='empty'>Порожньо. Тисни «+ Запис».</div>";return}
 $("#view").innerHTML=L.map(card).join("");
 $("#view").querySelectorAll("[data-act]").forEach(function(b){
  b.onclick=function(){
   var o=items.filter(function(x){return x.id===b.dataset.id})[0],a=b.dataset.act;
   if(a==="edit")return openForm(o);
   if(a==="del"){if(confirm("Видалити запис?")){items=items.filter(function(x){return x.id!==o.id});save();draw();toast("Видалено")}return}
   o[a]=!o[a];
   if(a==="returned")o.returnedAt=o.returned?ymd(today()):"";
   if(a==="depTaken")o.depTakenAt=o.depTaken?(o.depTakenAt||ymd(today())):"";
   if(a==="depBack"){o.depBackAt=o.depBack?(o.depBackAt||ymd(today())):"";if(o.depBack){o.depTaken=true;o.done=true}}
   save();draw();toast("Збережено")}});
}
function card(o){
 if(o.type==="spend")return "<div class='item sale'><div class='h'><span class='nm'>Витрата</span><span class='mono'>"+fm(o.from)+"</span></div><div class='sub'>"+esc(o.note||"")+"</div><div class='sumline'>− "+(+o.sum||0)+" ₴</div><div class='badges'><button class='b' data-act='edit' data-id='"+o.id+"'>Змінити</button><button class='b del' data-act='del' data-id='"+o.id+"'>Видалити</button></div></div>";
 var days=(o.from&&o.to)?Math.max(1,Math.round((pd(o.to)-pd(o.from))/864e5)):0;
 return "<div class='item"+(o.type==="sale"?" sale":"")+"' style='border-left-color:"+clr(o.costume)+"'>"+stImg(o.costume)+
  "<div class='h'><span class='nm'>"+esc(o.costume)+(o.type==="sale"?" · продаж":"")+"</span><span class='mono'>"+(o.city||"")+"</span></div>"+
  "<div class='sub'>"+esc(o.client||"без імені")+(o.ttn?" · ТТН "+esc(o.ttn):"")+"</div>"+
  (o.type==="sale"?"<div class='dates'>дата: "+fm(o.from)+"</div>":
   "<div class='dates'>віддали "+fm(o.ship)+" · оренда "+fm(o.from)+(o.to&&o.to!==o.from?"–"+fm(o.to):"")+" ("+days+" діб) · назад "+fm(o.back)+"</div>")+
  "<div class='sumline'>сума "+(+o.sum||0)+" ₴"+(o.type!=="sale"?" · застава "+(+o.dep||0)+" ₴":"")+"</div>"+
  "<div class='badges'>"+
   "<button class='b"+(o.paid?" on":"")+"' data-act='paid' data-id='"+o.id+"'>"+(o.paid?"✓ оплачено":"оплачено")+"</button>"+
   (o.type!=="sale"?"<button class='b dep"+(o.depTaken?" on":"")+"' data-act='depTaken' data-id='"+o.id+"'>"+(o.depTaken?"✓ застава у нас":"застава не взята")+"</button>":"")+
   "<button class='b"+(o.sent?" on":"")+"' data-act='sent' data-id='"+o.id+"'>"+(o.sent?"✓ відправлено":"відправлено")+"</button>"+
   (o.type!=="sale"?"<button class='b"+(o.returned?" on":"")+"' data-act='returned' data-id='"+o.id+"'>"+(o.returned?"✓ повернули":"повернули")+"</button>":"")+
   (o.type!=="sale"?"<button class='b dep"+(o.depBack?" on":"")+"' data-act='depBack' data-id='"+o.id+"'>"+(o.depBack?"✓ заставу віддали":"віддати заставу")+"</button>":"")+
   "<button class='b' data-act='edit' data-id='"+o.id+"'>Змінити</button>"+
   "<button class='b del' data-act='del' data-id='"+o.id+"'>Видалити</button>"+
  "</div></div>";
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---------- гроші ---------- */
function moneyView(){
 var key=mk(ymd(mcur)),r=stats(key);
 var head="<div class='calhead'><button type='button' id='mp'>‹</button><h3>"+mname(key)+"</h3><button type='button' id='mn'>›</button></div>"+
  "<div class='msum'>"+
  "<div class='m in'><b>"+nf(r.inc)+" ₴</b><span>заробила ("+r.cnt+" зам.)</span></div>"+
  "<div class='m out'><b>"+nf(r.out)+" ₴</b><span>витрати</span></div>"+
  "<div class='m net'><b>"+nf(r.net)+" ₴</b><span>чистими</span></div>"+
  "<div class='m dep'><b>"+nf(r.depIn)+" ₴</b><span>застав взяла</span></div>"+
  "<div class='m dep'><b>"+nf(r.depOut)+" ₴</b><span>застав повернула</span></div>"+
  "<div class='m dep'><b>"+nf(onHand())+" ₴</b><span>на руках зараз</span></div></div>"+
  "<p class='mhint'>Дохід рахується за датою оренди або продажу, тільки оплачені. Застава — не дохід.</p><h2>Записи за місяць</h2>";
 var rows=items.filter(function(o){return mk(o.from)===key||(o.type==="rent"&&((o.depTaken&&mk(depTakenDate(o))===key)||(o.depBack&&mk(depBackDate(o))===key)))}).slice().sort(function(a,b){return String(b.from).localeCompare(String(a.from))}).map(function(o){
  var plus=o.type!=="spend"&&o.paid, minus=o.type==="spend";
  return "<div class='item' style='border-left-color:"+(minus?"var(--red)":"var(--lime)")+"'><div class='h'><span class='nm' style='font-size:15px'>"+
   esc(o.type==="spend"?("Витрата: "+(o.note||"")):(o.costume+(o.type==="sale"?" · продаж":" · оренда")))+
   "</span><span class='mono'>"+fm(o.from)+"</span></div><div class='sumline'>"+(minus?"−":(plus?"+":"не оплачено "))+(+o.sum||0)+" ₴"+
   (o.type==="rent"&&o.dep?" · застава "+nf(+o.dep)+" ₴ "+(o.depBack?"повернута "+fm(depBackDate(o)):(o.depTaken?"у мене з "+fm(depTakenDate(o)):"не взята")):"")+"</div></div>"}).join("");
 $("#view").innerHTML=head+(rows||"<div class='empty'>За цей місяць записів немає.</div>")+
  "<p class='note'>Застава — окремо: може бути ще не взята, взята готівкою або йти накладеним платежем. Застави не є доходом, ми їх повертаємо.</p>";
 $("#mp").onclick=function(){mcur=new Date(mcur.getFullYear(),mcur.getMonth()-1,1);draw()};
 $("#mn").onclick=function(){mcur=new Date(mcur.getFullYear(),mcur.getMonth()+1,1);draw()};
}

/* ---------- костюми, кількість і баланс ---------- */
var STOCK0={"Павук":1,"Бетмен":1,"Охоронець":1,"Біомеханіка":1,"Щур":4,"Акула рожева":2,"Акула скелет":1,"Акула блакитна":1};
var COST=Object.keys(STOCK0);
var bcur=ymd(today());
function stock(){var r={};COST.forEach(function(c){r[c]=STOCK0[c]});
 try{var x=JSON.parse(localStorage.getItem("oblik_stock")||"{}");COST.forEach(function(c){if(typeof x[c]==="number"&&x[c]>=0)r[c]=x[c]})}catch(e){}
 return r}
function lines(o){
 if(o.lines&&o.lines.length)return o.lines;
 var m=String(o.costume||"").match(/^(.*?)\s*[×x]\s*(\d+)$/);
 if(m)return [{c:m[1].trim(),n:+m[2]}];
 return [{c:o.costume,n:1}]}
function label(L){return L.map(function(l){return l.n>1?l.c+" ×"+l.n:l.c}).join(" + ")}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function lagOf(o){return /харк/i.test(o.city||"")?1:2}
/* де костюм із цього запису в день s: "road" — в дорозі, "rent" — в клієнта, "" — вдома */
function stateOf(o,s){
 if(o.type!=="rent"||!o.from)return "";
 var from=o.from,to=o.to||o.from,ship=o.ship||from,back=o.back||addDays(to,1);
 if(s<ship)return "";
 if(s<from)return "road";
 if(s<back)return "rent";
 if(!(o.returned||o.done))return "road";
 var arr=o.returnedAt||addDays(back,lagOf(o));
 return s<arr?"road":""}
function counts(s){
 var st=stock(),r={};
 COST.forEach(function(c){r[c]={all:st[c],road:0,rent:0,home:0}});
 items.forEach(function(o){var k=stateOf(o,s);if(!k)return;lines(o).forEach(function(l){if(r[l.c])r[l.c][k]+=l.n})});
 COST.forEach(function(c){r[c].home=r[c].all-r[c].road-r[c].rent});
 return r}
function totals(r){var t={all:0,home:0,road:0,rent:0};
 COST.forEach(function(c){t.all+=r[c].all;t.road+=r[c].road;t.rent+=r[c].rent;t.home+=Math.max(0,r[c].home)});
 return t}
function balTiles(t){
 return "<div class='m hd'><b>"+t.home+"</b><span>на руках</span></div>"+
  "<div class='m rt'><b>"+t.road+"</b><span>в дорозі</span></div>"+
  "<div class='m rd'><b>"+t.rent+"</b><span>в оренді</span></div>"+
  "<div class='m al'><b>"+t.all+"</b><span>всього костюмів</span></div>"}
function balTop(){
 $("#bal").innerHTML=balTiles(totals(counts(ymd(today()))));
 $("#bal").onclick=function(){tab="bal";draw()}}
function balView(){
 var v=$("#view"),s=bcur,r=counts(s),t=totals(r),isT=(s===ymd(today()));
 var h="<div class='calhead'><button type='button' id='bp'>‹</button><h3>"+(isT?"Сьогодні · ":"")+
  pd(s).toLocaleDateString("uk-UA",{day:"numeric",month:"long"})+"</h3><button type='button' id='bn'>›</button></div>";
 if(!isT)h+="<button class='b on' id='bt' type='button'>Повернутись до сьогодні</button>";
 h+="<div class='money'>"+balTiles(t)+"</div>";
 COST.forEach(function(c){var x=r[c];
  h+="<div class='bcard"+(x.home<0?" over":"")+"'><img src='media/st/"+stKey(c)+".png' alt=''><div><div class='bn'>"+c+"</div>"+
   "<div class='bs'>в дорозі "+x.road+" · в оренді "+x.rent+"</div>"+
   (x.home<0?"<div class='bs' style='color:var(--red)'>⚠ перебронь: бракує "+(-x.home)+"</div>":"")+
   "</div><div class='bh'>"+Math.max(0,x.home)+" з "+x.all+"</div></div>"});
 var days=[];for(var i=0;i<7;i++)days.push(addDays(s,i));
 var rc=days.map(counts);
 h+="<h2>Вільно по днях</h2><div class='wk'><table><thead><tr><th></th>"+days.map(function(d){return "<th>"+fm(d)+"</th>"}).join("")+"</tr></thead><tbody>"+
  COST.map(function(c){return "<tr><td>"+c+"</td>"+rc.map(function(x){var n=x[c].home;return "<td"+(n<0?" class='z'":"")+">"+n+"</td>"}).join("")+"</tr>"}).join("")+
  "</tbody></table></div><p class='mhint'>Число — скільки цього костюма лежить у тебе на руках у той день. Дорога туди й назад враховується.</p>";
 var od=items.filter(function(o){
  if(o.type!=="rent"||o.returned||o.done)return false;
  var b=o.back||addDays(o.to||o.from,1);return ymd(today())>addDays(b,lagOf(o)+2)});
 if(od.length)h+="<div class='warn'>⚠ Не відмічено «повернули»: "+od.map(function(o){return esc(o.costume)+" ("+fm(o.from)+")"}).join(", ")+". Поки не відмічено, ці костюми рахуються в дорозі. Відкрий «В роботі» і натисни «повернули».</div>";
 var st=stock();
 h+="<h2>Скільки всього</h2><div class='add'>"+COST.map(function(c){return "<div class='stock'><span>"+c+"</span><input type='number' min='0' inputmode='numeric' data-c='"+c+"' value='"+st[c]+"'></div>"}).join("")+
  "<button class='btn lime' id='st_save' type='button'>Зберегти кількість</button></div>";
 v.innerHTML=h;
 $("#bp").onclick=function(){bcur=addDays(bcur,-1);draw()};
 $("#bn").onclick=function(){bcur=addDays(bcur,1);draw()};
 if($("#bt"))$("#bt").onclick=function(){bcur=ymd(today());draw()};
 $("#st_save").onclick=function(){var o={};v.querySelectorAll(".stock input").forEach(function(e){o[e.dataset.c]=Math.max(0,Math.round(+e.value||0))});
  try{localStorage.setItem("oblik_stock",JSON.stringify(o))}catch(e){}
  draw();toast("Кількість збережено")};
}

/* ---------- форма ---------- */
function openForm(o){
 ed=o||null;
 var d=o||{type:"rent",lines:[{c:"Щур",n:1}],from:ymd(today()),paid:true};
 var L=lines(d).map(function(l){return {c:l.c,n:l.n}}),autoSum=!o||!+d.sum,autoDep=!o;
 var v=$("#view");
 tab="form";drawTabs();$("#fab").hidden=true;
 v.innerHTML="<div class='add'>"+
  "<label>Тип</label><select id='f_type'><option value='rent'>Оренда</option><option value='sale'>Продаж</option><option value='spend'>Витрата</option></select>"+
  "<div id='f_costbox'><label>Костюми (можна кілька)</label><div id='f_lines'></div><button class='btn ghost' id='f_addline' type='button' style='margin-top:10px;padding:12px;min-height:46px;font-size:14px'>+ Додати ще костюм</button></div>"+
  "<label>Клієнт (імʼя, нік, телефон)</label><input id='f_client' type='text'>"+
  "<div class='row2'><div><label>Місто</label><input id='f_city' type='text'></div><div><label>ТТН</label><input id='f_ttn' type='text'></div></div>"+
  "<div class='row2'><div><label id='l_from'>Оренда з</label><input id='f_from' type='date'></div><div><label>Оренда по</label><input id='f_to' type='date'></div></div>"+
  "<div class='row2'><div><label>Відправила</label><input id='f_ship' type='date'></div><div><label>Відправляють назад</label><input id='f_back' type='date'></div></div>"+
  "<div class='row2'><div><label>Сума, ₴</label><input id='f_sum' type='number' inputmode='numeric'></div><div><label>Застава, ₴</label><input id='f_dep' type='number' inputmode='numeric'></div></div>"+
  "<div class='row2' id='f_deprow'><div><label>Заставу взяла (дата)</label><input id='f_dtk' type='date'></div><div><label>Заставу повернула (дата)</label><input id='f_dbk' type='date'></div></div>"+
  "<label class='chk'><input id='f_paid' type='checkbox'> Оплачено</label>"+
  "<label>Нотатка</label><textarea id='f_note'></textarea>"+
  "<button class='btn lime' id='f_save' type='button'>Зберегти запис</button>"+
  "<button class='btn ghost' id='f_cancel' type='button'>Скасувати, не зберігати</button>"+
  (o?"<button class='btn red' id='f_del' type='button'>Видалити запис</button>":"")+"</div>";
 $("#f_type").value=d.type;
 $("#f_client").value=d.client||"";$("#f_city").value=d.city||"";$("#f_ttn").value=d.ttn||"";
 $("#f_from").value=d.from||"";$("#f_to").value=d.to||"";$("#f_ship").value=d.ship||"";$("#f_back").value=d.back||"";
 $("#f_sum").value=d.sum!=null?d.sum:"";$("#f_dep").value=d.dep!=null?d.dep:800*units();$("#f_note").value=d.note||"";
 $("#f_paid").checked=d.paid!==false&&(o?!!o.paid:true);
 $("#f_dtk").value=d.depTaken?(d.depTakenAt||depTakenDate(d)):"";$("#f_dbk").value=d.depBack?(d.depBackAt||depBackDate(d)):"";
 function units(){return L.reduce(function(a,l){return a+l.n},0)}
 function drawLines(){
  var w=$("#f_lines");
  w.innerHTML=L.map(function(l,i){
   var opts=COST.slice();if(opts.indexOf(l.c)<0)opts.push(l.c);
   return "<div class='costrow' style='margin-top:8px'><img src='media/st/"+(stKey(l.c)||"rat")+".png' alt='' style='width:48px'>"+
    "<select class='ls' data-i='"+i+"' aria-label='Костюм'>"+opts.map(function(c){return "<option"+(c===l.c?" selected":"")+">"+c+"</option>"}).join("")+"</select>"+
    "<input class='lq' data-i='"+i+"' type='number' min='1' inputmode='numeric' value='"+l.n+"' style='width:74px;flex:none' aria-label='Кількість'>"+
    (L.length>1?"<button class='b del lx' data-i='"+i+"' type='button' aria-label='Прибрати'>✕</button>":"")+"</div>"}).join("");
  w.querySelectorAll(".ls").forEach(function(e){e.onchange=function(){L[+e.dataset.i].c=e.value;drawLines();auto()}});
  w.querySelectorAll(".lq").forEach(function(e){e.oninput=function(){L[+e.dataset.i].n=Math.max(1,Math.round(+e.value)||1);auto()}});
  w.querySelectorAll(".lx").forEach(function(e){e.onclick=function(){L.splice(+e.dataset.i,1);drawLines();auto()}})}
 function sync(){var t=$("#f_type").value;
  $("#f_costbox").hidden=(t==="spend");
  $("#l_from").textContent=t==="rent"?"Оренда з":"Дата";
  ["f_to","f_ship","f_back","f_dep"].forEach(function(id){$("#"+id).closest("div").hidden=(t!=="rent")});
  $("#f_deprow").hidden=(t!=="rent");$("#f_paid").closest("label").hidden=(t==="spend");
  auto()}
 function auto(){
  if($("#f_type").value!=="rent")return;
  var f=$("#f_from").value,t=$("#f_to").value;
  if(f&&t&&(autoSum||!$("#f_sum").value)){var dd=Math.max(1,Math.round((pd(t)-pd(f))/864e5)),tot=0;L.forEach(function(l){tot+=l.n*price(l.c)});$("#f_sum").value=tot*dd;autoSum=true}
  if(autoDep)$("#f_dep").value=800*units();
  var np=!/харк/i.test($("#f_city").value||""), lag=np?2:1;
  if(f&&!$("#f_ship").value){var s=pd(f);s.setDate(s.getDate()-lag);$("#f_ship").value=ymd(s)}
  if(t&&!$("#f_back").value){var b=pd(t);b.setDate(b.getDate()+lag);$("#f_back").value=ymd(b)}}
 $("#f_type").onchange=sync;$("#f_city").onchange=auto;$("#f_from").onchange=auto;$("#f_to").onchange=auto;
 $("#f_sum").oninput=function(){autoSum=false};$("#f_dep").oninput=function(){autoDep=false};
 $("#f_addline").onclick=function(){L.push({c:"Щур",n:1});drawLines();auto()};
 drawLines();sync();
 $("#f_cancel").onclick=function(){tab="cal";draw()};
 if($("#f_del"))$("#f_del").onclick=function(){if($("#f_del").dataset.sure){items=items.filter(function(x){return x.id!==o.id});save();tab="cal";draw();toast("Видалено")}else{$("#f_del").dataset.sure=1;$("#f_del").textContent="Точно видалити? Натисни ще раз"}};
 $("#f_save").onclick=function(){
  var o=ed||{id:uid()};
  o.type=$("#f_type").value;o.lines=L.map(function(l){return {c:l.c,n:l.n}});o.costume=label(L);o.client=$("#f_client").value.trim();
  o.city=$("#f_city").value.trim();o.ttn=$("#f_ttn").value.trim();
  o.from=$("#f_from").value;o.to=$("#f_to").value;o.ship=$("#f_ship").value;o.back=$("#f_back").value;
  o.sum=+$("#f_sum").value||0;o.dep=+$("#f_dep").value||0;o.note=$("#f_note").value.trim();
  o.paid=o.type==="spend"?false:$("#f_paid").checked;
  if(o.type==="rent"){var dt=$("#f_dtk").value,db=$("#f_dbk").value;
   o.depTaken=!!(dt||db);o.depTakenAt=dt||(db?db:"");o.depBack=!!db;o.depBackAt=db;if(db)o.done=true}
  if(o.type!=="rent"){o.to="";o.ship="";o.back=""}
  if(!ed)items.push(o);
  save();tab="cal";draw();toast(ed?"Оновлено":"Додано")};
}

function draw(){
 $("#fab").hidden=false;drawTabs();money();balTop();
 if(tab==="cal")calendar();
 else if(tab==="bal")balView();
 else if(tab==="now")list(function(o){return o.type!=="spend"&&!o.done});
 else if(tab==="all")list(function(){return true});
 else if(tab==="money")moneyView();
}
$("#fab").onclick=function(){openForm(null)};
load();
draw();
})();
</script></body></html>
